name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@v6.5.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run Typecheck
        run: npm run typecheck
      - name: Run Tests
        run: npm run test
      - name: Build
        run: npm run build
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
